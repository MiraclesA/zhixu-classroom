server.port=${ZHIXU_PORT:8097}
server.address=${ZHIXU_BIND:127.0.0.1}
spring.datasource.url=${ZHIXU_DB_URL:jdbc:mysql://127.0.0.1:3317/zhixu?connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${ZHIXU_DB_USER:zhixu}
spring.datasource.password=${ZHIXU_DB_PASSWORD}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
zhixu.demo=${ZHIXU_DEMO:false}
zhixu.teacher-invite=${ZHIXU_TEACHER_INVITE:}
